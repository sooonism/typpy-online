<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)" />

  <g transform="translate(80,90)">
    <text x="0" y="0" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">From effortful keystrokes to effortless flow</text>
    <text x="0" y="56" fill="#dff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">motor chunking in typing</text>

    <foreignObject x="0" y="96" width="520" height="220">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Inter, Arial, sans-serif; color: rgba(255,255,255,0.95); font-size:16px;">
        <p style="max-width:520px;">Repeated sequences become single motor units. Practice common phrases and code snippets to build chunks that make long passages feel automated — and learn how to detect chunk boundaries in your own typing data.</p>
      </div>
    </foreignObject>
  </g>

  <!-- Chunk visualization -->
  <g transform="translate(680,120)">
    <!-- sequence of keys grouped into three chunks -->
    <g fill="#fff" opacity="0.95">
      <!-- chunk 1 -->
      <rect x="0" y="0" width="120" height="40" rx="8" fill="#ffffff" opacity="0.12" stroke="#ffffff22" />
      <rect x="10" y="8" width="20" height="24" rx="4" fill="#86efac" />
      <rect x="36" y="8" width="20" height="24" rx="4" fill="#86efac" />
      <rect x="62" y="8" width="20" height="24" rx="4" fill="#86efac" />
      <rect x="88" y="8" width="20" height="24" rx="4" fill="#86efac" />

      <!-- chunk 2 -->
      <rect x="156" y="0" width="160" height="40" rx="8" fill="#ffffff" opacity="0.12" stroke="#ffffff22" />
      <rect x="166" y="8" width="24" height="24" rx="4" fill="#60a5fa" />
      <rect x="196" y="8" width="24" height="24" rx="4" fill="#60a5fa" />
      <rect x="226" y="8" width="24" height="24" rx="4" fill="#60a5fa" />
      <rect x="256" y="8" width="24" height="24" rx="4" fill="#60a5fa" />
      <rect x="286" y="8" width="24" height="24" rx="4" fill="#60a5fa" />

      <!-- chunk 3 -->
      <rect x="332" y="0" width="140" height="40" rx="8" fill="#ffffff" opacity="0.12" stroke="#ffffff22" />
      <rect x="342" y="8" width="28" height="24" rx="4" fill="#fde047" />
      <rect x="378" y="8" width="28" height="24" rx="4" fill="#fde047" />
      <rect x="414" y="8" width="28" height="24" rx="4" fill="#fde047" />
    </g>

    <!-- arrows to indicate chunk execution -->
    <g stroke="#ffffffbb" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M130 20 C150 10, 156 10, 156 20" />
      <path d="M316 20 C332 10, 332 10, 332 20" />
    </g>

    <!-- IKIs sparkline below -->
    <polyline points="0,90 20,72 40,76 60,74 80,72 100,80 120,64 140,70 160,66 180,68 200,86" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.9" />

    <text x="0" y="120" fill="#ffffffaa" font-family="Inter, Arial, sans-serif" font-size="14">IKI pattern (dips within chunks, spikes at boundaries)</text>
  </g>

  <text x="80" y="570" fill="#ffffff55" font-family="Inter, Arial, sans-serif" font-size="16">Typpy Team — typpy.online</text>
</svg>