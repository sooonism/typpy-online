<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)" />

  <g transform="translate(80,80)">
    <text x="0" y="0" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">Why click matters</text>
    <text x="0" y="64" fill="#ffece6" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">how tactile &amp; auditory feedback change the feel of typing</text>

    <foreignObject x="0" y="110" width="520" height="220">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Inter, Arial, sans-serif; color: rgba(255,255,255,0.95); font-size:16px;">
        <p style="max-width:520px;">Tactile bumps and key clicks provide timing and error cues. Labs show added haptics and click sounds improve rhythm and reduce some errors — here are quick tests and tuning tips.</p>
      </div>
    </foreignObject>
  </g>

  <!-- speaker + waveform + key icon -->
  <g transform="translate(700,120)">
    <!-- speaker icon -->
    <g>
      <rect x="0" y="0" width="80" height="80" rx="10" fill="#ffffff20" />
      <polygon points="86,10 120,40 86,70" fill="#fff" opacity="0.95" />
    </g>

    <!-- waveform lines -->
    <g transform="translate(150,6)" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0 40 Q20 10, 40 40 T80 40 T120 40" />
      <path d="M0 50 Q20 20, 40 50 T80 50 T120 50" opacity="0.7" />
    </g>

    <!-- tactile key icon -->
    <g transform="translate(20,110)">
      <rect x="0" y="0" width="180" height="60" rx="12" fill="#ffffff12" stroke="#ffffff22" />
      <rect x="20" y="12" width="40" height="36" rx="6" fill="#fff" />
      <rect x="72" y="12" width="40" height="36" rx="6" fill="#fff" />
      <rect x="124" y="12" width="40" height="36" rx="6" fill="#fff" />

      <!-- tactile bump marker -->
      <circle cx="40" cy="18" r="4" fill="#ffb86b" />
    </g>
  </g>

  <text x="80" y="570" fill="#ffffff70" font-family="Inter, Arial, sans-serif" font-size="16">Typpy Team — typpy.online</text>
</svg>