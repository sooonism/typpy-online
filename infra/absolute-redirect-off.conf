# Fix: backend nginx only speaks plain HTTP (TLS is terminated upstream by
# Nginx Proxy Manager / Cloudflare), so its built-in trailing-slash redirect
# for directory requests (e.g. /about -> /about/) was emitting an absolute
# http:// Location header, downgrading the client to plain HTTP for one hop
# before it got redirected back up to https. A relative redirect avoids the
# scheme entirely, so the client just stays on https.
absolute_redirect off;
